name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install fsck.vfat
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dosfstools
      - name: Test
        run: go test -race ./...
      - name: Test without exFAT (release build tags)
        run: go test -tags fat_noexfat ./internal/bootfs ./internal/flash

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; exit 1)
      - name: go vet (all platforms)
        run: |
          go vet ./...
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Third-party licences
        run: scripts/third-party-licenses.sh > /dev/null

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Cross-compile
        run: make cross VERSION=ci-${{ github.sha }}
      - name: Linux packages
        run: scripts/package-linux.sh 0.0.0-ci amd64
